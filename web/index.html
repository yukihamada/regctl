<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>regctl.sh — Domain Search</title>
<style>
:root {
  --bg: #111111; --surface: #1a1a1a; --surface2: #222222; --surface3: #2a2a2a;
  --border: #2d2d2d; --border2: #3a3a3a;
  --text: #f0f0f0; --muted: #888888; --muted2: #555555;
  --accent: #f6821f; --accent-h: #e07010;
  --green: #3fb950; --blue: #60a5fa; --red: #f87171;
  --radius: 8px; --radius-sm: 4px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 14px; min-height: 100vh; }
a { color: var(--blue); text-decoration: none; }
input, select { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 14px; outline: none; width: 100%; transition: border-color .15s; }
input:focus { border-color: var(--accent); }
button { cursor: pointer; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; padding: 8px 16px; transition: all .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-h); }
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
.btn-secondary:hover { background: var(--surface3); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-green { background: rgba(63,185,80,.15); color: var(--green); }
.badge-gray { background: var(--surface2); color: var(--muted); }

/* Layout */
.topbar { height: 48px; background: rgba(17,17,17,.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; }
.topbar-logo { font-size: 16px; font-weight: 800; color: var(--text); }
.topbar-logo span { color: var(--accent); }
.topbar-back { color: var(--muted); font-size: 13px; }
.topbar-back:hover { color: var(--text); }
.main { max-width: 780px; margin: 0 auto; padding: 40px 24px; }

/* Search */
.search-box { display: flex; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; margin-bottom: 24px; transition: border-color .15s; }
.search-box:focus-within { border-color: var(--accent); }
.search-box input { flex: 1; border: none; background: transparent; font-size: 16px; padding: 14px 20px; border-radius: 0; }
.search-box button { border-radius: 0; padding: 14px 28px; font-size: 15px; font-weight: 600; background: var(--accent); color: #fff; }
.search-box button:hover { background: var(--accent-h); }

/* Results */
.result-info { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.result-title { font-size: 18px; font-weight: 700; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.tld-list { display: flex; flex-direction: column; gap: 6px; }
.tld-row { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; gap: 12px; transition: border-color .15s; }
.tld-row:hover { border-color: var(--border2); }
.tld-row.available { border-left: 3px solid var(--green); }
.tld-row.taken { border-left: 3px solid var(--muted2); opacity: .6; }
.tld-row.loading { opacity: .4; }
.tld-name { font-weight: 600; font-size: 15px; min-width: 200px; }
.tld-status { flex: 1; font-size: 12px; color: var(--muted); }
.tld-price { font-size: 16px; font-weight: 700; color: var(--accent); min-width: 100px; text-align: right; }
.tld-reg { font-size: 11px; color: var(--muted); }
.tld-action { min-width: 80px; text-align: right; }

/* History */
.history { margin-top: 40px; }
.history-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px; }
.history-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.history-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all .15s; }
.history-chip:hover { color: var(--text); border-color: var(--border2); }

/* Toast */
#toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 16px; font-size: 13px; display: none; z-index: 99; }
.toast-success { border-left: 3px solid var(--green); }
.toast-error { border-left: 3px solid var(--red); }
</style>
</head>
<body>
<div class="topbar">
  <a class="topbar-logo" href="/">regctl<span>.sh</span></a>
  <span style="color:var(--muted2)">·</span>
  <a class="topbar-back" href="/">← Back to home</a>
</div>

<div class="main">
  <div style="margin-bottom:32px">
    <h1 style="font-size:24px;font-weight:700;margin-bottom:6px">Domain Search</h1>
    <p style="color:var(--muted)">Check availability and compare prices across 1,343 TLDs</p>
  </div>

  <div class="search-box">
    <input id="q" type="text" placeholder="Enter a domain name or keyword…" autocomplete="off"
      onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Search</button>
  </div>

  <div id="result-area" style="display:none">
    <div class="result-info">
      <span class="result-title" id="result-label"></span>
      <span class="spinner" id="result-spinner" style="display:none"></span>
    </div>
    <div class="tld-list" id="tld-list"></div>
  </div>

  <div class="history" id="history-area" style="display:none">
    <div class="history-title">Recent Searches</div>
    <div class="history-chips" id="history-chips"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const POPULAR_TLDS = ['.com','.io','.net','.org','.dev','.ai','.app','.co','.sh','.xyz','.me','.info','.tech','.site'];

function doSearch() {
  const raw = document.getElementById('q').value.trim();
  if (!raw) return;
  const name = raw.replace(/^https?:\/\//, '').split('.')[0].split('/')[0];
  if (!name) return;
  saveHistory(name);
  renderResults(name);
}

function renderResults(name) {
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('result-label').textContent = '"' + name + '"';
  document.getElementById('result-spinner').style.display = 'inline-block';

  const list = document.getElementById('tld-list');
  list.innerHTML = POPULAR_TLDS.map(t => `
    <div class="tld-row loading" id="r${t.replace('.','_')}">
      <div class="tld-name">${name}${t}</div>
      <div class="tld-status"><span class="spinner"></span></div>
      <div class="tld-price"></div><div class="tld-action"></div>
    </div>`).join('');

  let done = 0;
  POPULAR_TLDS.forEach(async tld => {
    const domain = name + tld;
    const rowId = 'r' + tld.replace('.', '_');
    try {
      const res = await fetch(`/v1/domains/check/${domain}`);
      const data = await res.json();
      const row = document.getElementById(rowId);
      if (!row) return;
      row.classList.remove('loading');
      if (data.available) {
        row.classList.add('available');
        row.innerHTML = `
          <div class="tld-name">${domain}</div>
          <div class="tld-status"><span class="badge badge-green">Available</span></div>
          <div class="tld-price">${data.price ? '$' + Number(data.price).toFixed(2) + '/yr' : '—'}</div>
          <div class="tld-action"><button class="btn-primary" style="font-size:12px;padding:6px 12px" onclick="register('${domain}')">Register</button></div>`;
      } else {
        row.classList.add('taken');
        row.innerHTML = `
          <div class="tld-name">${domain}</div>
          <div class="tld-status"><span class="badge badge-gray">Taken</span></div>
          <div class="tld-price" style="color:var(--muted2)">—</div>
          <div class="tld-action"><a href="https://lookup.icann.org/en/lookup?name=${domain}" target="_blank" style="font-size:12px">WHOIS ↗</a></div>`;
      }
    } catch(e) {
      const row = document.getElementById(rowId);
      if (row) { row.classList.remove('loading'); row.innerHTML = `<div class="tld-name">${name}${tld}</div><div class="tld-status" style="color:var(--muted2)">Error</div><div class="tld-price"></div><div class="tld-action"></div>`; }
    }
    if (++done >= POPULAR_TLDS.length) document.getElementById('result-spinner').style.display = 'none';
  });
}

async function register(domain) {
  const user = JSON.parse(localStorage.getItem('regctl_user') || 'null');
  if (!user) { window.location.href = '/?register=' + encodeURIComponent(domain); return; }
  if (!confirm(`Register ${domain}?\nCredits will be deducted from your balance.`)) return;
  try {
    const res = await fetch('/v1/domains', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user.api_key },
      body: JSON.stringify({ domain })
    });
    if (res.ok) { toast('✓ ' + domain + ' registered!', 'success'); }
    else { const d = await res.json(); toast('Error: ' + (d.message || res.status), 'error'); }
  } catch(e) { toast('Network error', 'error'); }
}

// History
function saveHistory(name) {
  const h = JSON.parse(localStorage.getItem('regctl_history') || '[]');
  const updated = [name, ...h.filter(x => x !== name)].slice(0, 10);
  localStorage.setItem('regctl_history', JSON.stringify(updated));
  renderHistory();
}

function renderHistory() {
  const h = JSON.parse(localStorage.getItem('regctl_history') || '[]');
  const area = document.getElementById('history-area');
  const chips = document.getElementById('history-chips');
  if (h.length === 0) { area.style.display = 'none'; return; }
  area.style.display = 'block';
  chips.innerHTML = h.map(n => `<span class="history-chip" onclick="loadHistory('${n}')">${n}</span>`).join('');
}

function loadHistory(name) {
  document.getElementById('q').value = name;
  renderResults(name);
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast-' + type;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// Init
renderHistory();
// Pre-fill from URL slug
const slug = location.pathname.replace('/', '').trim();
if (slug && !slug.includes('.')) {
  document.getElementById('q').value = slug;
  renderResults(slug);
}
</script>
</body>
</html>
